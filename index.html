<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coreano</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coreano">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icona-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fdf6f0">
  <style>
    :root {
      --sfondo: #fdf6f0; --scheda: #ffffff; --testo: #2b2a33;
      --tenue: #8a8796; --accento: #e0607e; --bordo: #f0e4dc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --sfondo: #1c1b22; --scheda: #2a2832; --testo: #f3f1f7;
              --tenue: #a19eae; --accento: #ff8fa8; --bordo: #3a3744; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--sfondo); color: var(--testo);
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }
    /* il "libro": ogni pagina occupa tutto lo schermo e si aggancia scorrendo */
    #libro {
      height: 100vh; height: 100dvh;
      overflow-y: auto; scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .pagina {
      height: 100vh; height: 100dvh;
      scroll-snap-align: start; scroll-snap-stop: always;
      display: flex; flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 18px max(14px, env(safe-area-inset-bottom));
      max-width: 520px; margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin: 6px 0 2px; }
    h1 span { color: var(--accento); }
    .sotto { color: var(--tenue); margin: 0 0 14px; font-size: .95rem; }
    .schede { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: center; min-height: 0; }
    .scheda {
      background: var(--scheda); border: 1px solid var(--bordo);
      border-radius: 20px; padding: 14px 18px; text-align: center;
    }
    .scheda.attiva { border: 2px solid var(--accento); }
    .etichetta { font-size: .75rem; color: var(--tenue); text-transform: uppercase; letter-spacing: .05em; }
    .ko { font-size: 2.8rem; font-weight: 700; margin: 4px 0 0; }
    .rom { color: var(--accento); font-size: 1.1rem; font-style: italic; }
    .it { font-size: 1.15rem; margin-top: 6px; }
    .nota { font-size: .75rem; color: var(--tenue); margin-top: 4px; }
    .ascolta {
      margin-top: 10px; border: 0; background: var(--bordo); color: var(--testo);
      padding: 7px 16px; border-radius: 999px; font-size: .9rem;
    }
    .suggerimento { text-align: center; color: var(--tenue); font-size: .85rem; margin: 12px 0 0; }
    .segnaposto { height: 1px; }
    footer { font-size: .65rem; color: var(--tenue); text-align: center; margin-top: 6px; line-height: 1.3; }
    footer a { color: inherit; }
    .riga-titolo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .apri-filtri, .pulsante {
      border: 0; background: var(--bordo); color: var(--testo);
      padding: 7px 12px; border-radius: 999px; font-size: .85rem;
    }
    .cat { font-size: .7rem; color: var(--tenue); margin-top: 4px; }
    #filtri {
      position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10;
      display: flex; align-items: flex-end; justify-content: center;
    }
    #filtri[hidden] { display: none; }
    .foglio {
      background: var(--sfondo); width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto;
      border-radius: 22px 22px 0 0; padding: 18px 18px max(18px, env(safe-area-inset-bottom));
    }
    .foglio h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .lista-cat { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 12px 0; }
    .lista-cat label, .riga-adulti { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
    .lista-cat small { color: var(--tenue); }
    .riga-adulti { margin: 6px 0 14px; padding: 10px; background: var(--scheda); border-radius: 12px; }
    .box-widget { background: var(--scheda); border: 1px dashed var(--bordo); border-radius: 12px; padding: 10px; font-size: .85rem; }
    #testo-widget { font-family: ui-monospace, monospace; display: block; margin: 6px 0; }
    .azioni-foglio { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .chiudi { background: var(--accento); color: white; border: 0; padding: 10px 18px; border-radius: 999px; font-size: 1rem; }
    #avviso {
      position: fixed; left: 16px; right: 16px; bottom: max(20px, env(safe-area-inset-bottom));
      background: var(--testo); color: var(--sfondo); padding: 12px 14px; border-radius: 14px;
      font-size: .9rem; z-index: 20; opacity: 0; transform: translateY(20px);
      transition: .25s; pointer-events: none; max-width: 488px; margin: 0 auto;
    }
    #avviso.visibile { opacity: 1; transform: none; }
    .voce { display: grid; gap: 10px; margin: 10px 0 20px; font-size: .9rem; }
    .voce select { margin-left: 8px; font-size: .95rem; padding: 4px; max-width: 70%; }
    .riga-scelte { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pulsante.scelto { background: var(--accento); color: white; }
  </style>
</head>
<body>
<div id="libro">Caricamento…</div>
<div id="filtri" hidden>
  <div class="foglio">
    <h2>Voce</h2>
    <div class="voce">
      <label>Voce <select id="scelta-voce"></select></label>
      <div class="riga-scelte">Tono
        <button class="pulsante" data-tono="0.9">Grave</button>
        <button class="pulsante" data-tono="1.2">Medio</button>
        <button class="pulsante" data-tono="1.5">Acuto</button>
      </div>
      <div class="riga-scelte">Velocità
        <button class="pulsante" data-velocita="0.3">Molto lenta</button>
        <button class="pulsante" data-velocita="0.5">Lenta</button>
        <button class="pulsante" data-velocita="0.8">Normale</button>
        <button class="pulsante" data-velocita="1">Veloce</button>
      </div>
    </div>
    <h2>Argomenti</h2>
    <p class="sotto">Scegli uno o più argomenti. Se non ne scegli nessuno escono parole di tutti.</p>
    <div class="lista-cat"></div>
    <label class="riga-adulti"><input type="checkbox" id="adulti"> Mostra anche parole volgari (18+)</label>
    <div class="box-widget">
      Per avere le stesse parole nel widget, scrivi questo testo nel campo
      <b>Parameter</b> del widget (tieni premuto il widget → Modifica widget):
      <code id="testo-widget"></code>
      <button class="pulsante copia">Copia</button>
    </div>
    <div class="azioni-foglio">
      <button class="pulsante tutti">Tutti gli argomenti</button>
      <button class="chiudi">Fatto</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
